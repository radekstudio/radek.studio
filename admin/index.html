<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Radek Studio — Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  CMS.init({
    config: {
      backend: {
        name: 'github',
        repo: 'radekstudio/radek.studio',
        branch: 'main',
        base_url: 'https://api.netlify.com',
        auth_endpoint: 'auth'
      },
      media_folder: 'public/images',
      public_folder: '/images',
      locale: 'cs',
      collections: [
        {
          name: 'hlavni-stranka',
          label: 'Hlavní stránka',
          files: [
            {
              name: 'hero',
              label: 'Úvodní fotka a text',
              file: '_data/hlavni.json',
              fields: [
                { label: 'Úvodní fotka (hero)', name: 'hero_image', widget: 'image', hint: 'Velká fotka nahoře na hlavní stránce.' },
                { label: 'Úvodní text', name: 'uvodni_text', widget: 'string' }
              ]
            }
          ]
        },
        {
          name: 'kategorie',
          label: 'Kategorie realizací',
          files: [
            {
              name: 'kuchynske-linky', label: 'Kuchyňské linky', file: '_data/kuchynske-linky.json',
              fields: [
                { label: 'Hero fotka', name: 'hero', widget: 'image', hint: 'Hlavní fotka kategorie.' },
                { label: 'Fotogalerie', name: 'fotky', widget: 'list', label_singular: 'Fotka',

                    { label: 'Fotka', name: 'src', widget: 'image' },

            },

              name: 'vestavljene-skrine', label: 'Vestavěné skříně', file: '_data/vestavljene-skrine.json',
