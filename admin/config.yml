backend:
  name: github
  repo: radekstudio/radek.studio
  branch: main

media_folder: public/images
public_folder: /images
locale: cs

collections:

  - name: "hlavni-stranka"
    label: "Hlavní stránka"
    files:
      - name: "hero"
        label: "Úvodní fotka a text"
        file: "_data/hlavni.json"
        fields:
          - label: "Úvodní fotka (hero)"
            name: "hero_image"
            widget: "image"
            hint: "Velká fotka nahoře na hlavní stránce."
          - label: "Úvodní text"
            name: "uvodni_text"
            widget: "string"

  - name: "kategorie"
    label: "Kategorie realizací"
    files:
      - name: "kuchynske-linky"
        label: "Kuchyňské linky"
        file: "_data/kuchynske-linky.json"
        fields:
          - { label: "Hero fotka", name: "hero", widget: "image" }
          - label: "Fotogalerie"
            name: "fotky"
            widget: "list"
            label_singular: "Fotka"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popis (SEO)", name: "alt", widget: "string" }

      - name: "vestavljene-skrine"
        label: "Vestavěné skříně"
