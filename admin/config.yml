backend:
  name: github
  repo: web radek.studio
  branch: main

media_folder: public/images
public_folder: /images

locale: cs

collections:

  # ─── HLAVNÍ STRÁNKA ───────────────────────────────────────────
  - name: "hlavni-stranka"
    label: "Hlavní stránka"
    files:
      - name: "hero"
        label: "Úvodní (hero) fotka"
        file: "_data/hlavni.json"
        fields:
          - label: "Úvodní fotka (hero)"
            name: "hero_image"
            widget: "image"
            hint: "Velká fotka zobrazená hned po načtení webu. Ideální rozměr: 1920×1080px nebo větší."
          - label: "Úvodní text (citát)"
            name: "uvodni_text"
            widget: "string"
            default: "Věnujeme se zakázkové výrobě kvalitního dřevěného nábytku na míru."

  # ─── KATEGORIE REALIZACÍ ──────────────────────────────────────
  - name: "kategorie"
    label: "Kategorie realizací"
    files:

      - name: "kuchynske-linky"
        label: "Kuchyňské linky"
        file: "_data/kuchynske-linky.json"
        fields:
          - label: "Hero fotka kategorie"
            name: "hero"
            widget: "image"
            hint: "Hlavní fotka která se zobrazí na kartičce v přehledu a nahoře na stránce kategorie."
          - label: "Fotogalerie"
            name: "fotky"
            widget: "list"
            label_singular: "Fotka"
            summary: "{{fields.alt}}"
            fields:
              - label: "Fotka"
                name: "src"
                widget: "image"
              - label: "Popis (alt text pro SEO)"
                name: "alt"
                widget: "string"
                hint: "Krátký popis fotky, např. 'Kuchyňská linka Brno 2024'"

      - name: "vestavljene-skrine"
        label: "Vestavěné skříně"
        file: "_data/vestavljene-skrine.json"
