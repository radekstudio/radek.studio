backend:
  name: github
  repo: radekstudio/radek.studio
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: public/images
public_folder: /images

locale: cs

collections:

  - name: "hlavni-stranka"
    label: "Hlavní stránka"
    files:
      - name: "hero"
        label: "Úvodní (hero) fotka"
        file: "_data/hlavni.json"
        fields:
          - label: "Úvodní fotka (hero)"
            name: "hero_image"
            widget: "image"
            hint: "Velká fotka zobrazená hned po načtení webu."
          - label: "Úvodní text (citát)"
            name: "uvodni_text"
            widget: "string"

  - name: "kategorie"
    label: "Kategorie realizací"
    files:

      - name: "kuchynske-linky"
        label: "Kuchyňské linky"
        file: "_data/kuchynske-linky.json"
        fields:
          - label: "Hero fotka kategorie"
            name: "hero"
            widget: "image"
            hint: "Hlavní fotka kategorie — zobrazí se na kartičce i nahoře na stránce."
          - label: "Fotogalerie"
            name: "fotky"
            widget: "list"
            label_singular: "Fotka"
            summary: "{{fields.alt}}"
            fields:
              - label: "Fotka"
                name: "src"
                widget: "image"
              - label: "Popis (pro SEO)"
                name: "alt"
                widget: "string"
                hint: "Např. 'Kuchyňská linka Brno 2024'"

      - name: "vestavljene-skrine"
        label: "Vestavěné skříně"
        file: "_data/vestavljene-skrine.json"
        fields:
          - label: "Hero fotka kategorie"
            name: "hero"
            widget: "image"
          - label: "Fotogalerie"
